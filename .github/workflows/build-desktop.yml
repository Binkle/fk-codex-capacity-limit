name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'packaging/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: CodexCapacityWatcher-macos
          - os: windows-latest
            artifact: CodexCapacityWatcher-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GUI build dependencies
        run: python -m pip install --upgrade pyinstaller PySide6 pytest

      - name: Verify window and tray lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q scripts/tests/test_codex_capacity_watcher_window.py

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: sh packaging/build-macos.sh

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/ensure-nsis.ps1

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist dist mkdir dist
          call packaging\build-windows.bat > dist\windows-build.log 2>&1
          set "BUILD_EXIT=%ERRORLEVEL%"
          type dist\windows-build.log
          exit /b %BUILD_EXIT%

      - name: Upload Windows build diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CodexCapacityWatcher-windows-diagnostics
          path: dist/windows-build.log
          if-no-files-found: ignore

      - name: Report Windows build log
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist/windows-build.log) {
            $tail = (Get-Content dist/windows-build.log -Tail 30) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows packaging error::$tail"
          }

      - name: Upload macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/CodexCapacityWatcher-macos.dmg
            dist/CodexCapacityWatcher-macos.zip

      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: dist/CodexCapacityWatcher-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: CodexCapacityWatcher-macos
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: CodexCapacityWatcher-windows
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Codex Capacity Watcher $GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
