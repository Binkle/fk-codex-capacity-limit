name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'packaging/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/build-desktop.yml'
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: CodexCapacityWatcher-macos
          - os: windows-latest
            artifact: CodexCapacityWatcher-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GUI build dependencies
        run: python -m pip install --upgrade pyinstaller PySide6 pytest

      - name: Verify window and tray lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q scripts/tests/test_codex_capacity_watcher_window.py

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: sh packaging/build-macos.sh

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/ensure-nsis.ps1

      - name: Set up .NET for MSI packaging
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist dist mkdir dist
          call packaging\build-windows.bat > dist\windows-build.log 2>&1
          set "BUILD_EXIT=%ERRORLEVEL%"
          type dist\windows-build.log
          exit /b %BUILD_EXIT%

      - name: Upload Windows build diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CodexCapacityWatcher-windows-diagnostics
          path: dist/windows-build.log
          if-no-files-found: ignore

      - name: Report Windows build log
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist/windows-build.log) {
            $tail = (Get-Content dist/windows-build.log -Tail 30) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows packaging error::$tail"
          }

      - name: Upload macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/CodexCapacityWatcher-macos.dmg
            dist/CodexCapacityWatcher-macos.zip

      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/CodexCapacityWatcher-Setup.exe
            dist/CodexCapacityWatcher-Setup.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release version
        id: version
        shell: bash
        run: |
          version=$(python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          package = ET.parse('packaging/windows-installer.wxs').getroot()[0]
          version = package.attrib['Version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid release version'
          nsis = Path('packaging/windows-installer.nsi').read_text(encoding='utf-8')
          assert f'VIProductVersion "{version}.0"' in nsis, 'EXE and MSI versions differ'
          assert f'VIAddVersionKey "FileVersion" "{version}"' in nsis, 'EXE version differs'
          print(version)
          PY
          )
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match installer version $tag"
            exit 1
          fi
          existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $tag already belongs to another commit; leaving its release unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifacts
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: CodexCapacityWatcher-macos
          path: release-assets

      - name: Download Windows installer
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: CodexCapacityWatcher-windows
          path: release-assets

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          assets=(CodexCapacityWatcher-Setup.exe CodexCapacityWatcher-Setup.msi CodexCapacityWatcher-macos.dmg CodexCapacityWatcher-macos.zip)
          for asset in "${assets[@]}"; do
            test -s "release-assets/$asset"
          done
          (cd release-assets && sha256sum "${assets[@]}" > SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Codex Capacity Watcher $RELEASE_TAG" \
              --generate-notes
          fi
